- name: Setup WSL
  hosts: localhost
  tasks:
    - name: Update APT
      become: true
      ansible.builtin.apt:
        name: "*"
    - name: Install packages
      become: true
      ansible.builtin.apt:
        name:
          - ansible-lint
          - zip
          - unzip
          - postgresql-all
          - postgresql-client
          - libecpg-dev
          - apache2
          - libapache2-mod-perl2-dev
          - libcgi-application-plugin-authentication-perl
          - libcgi-application-plugin-dbh-perl
          - libcgi-application-plugin-devpopup-perl
          - libcgi-application-plugin-session-perl
          - libcgi-application-plugin-validaterm-perl
          - libcgi-pm-perl
          - libcgi-session-perl
          - libcgi-session-serialize-yaml-perl
          - libhtml-template-pro-perl
          - libdbd-csv-perl
          - libdbd-excel-perl
          - libdbd-pg-perl
          - libdbd-odbc-perl
          - libdbd-sqlite3-perl
          - libdbi-perl
          - libdbi-test-perl
          - libyaml-perl
          - libyaml-libyaml-perl
          - libanyevent-perl
          - libclass-refresh-perl
          - libcompiler-lexer-perl
          - libscalar-list-utils-perl
          - libmoose-perl
          - libpadwalker-perl
          - libscalar-list-utils-perl
          - libcoro-perl
          - libperl-languageserver-perl
          - libzonemaster-ldns-perl
          - libxml-rpc-fast-perl
          - libxml-rss-simplegen-perl
          - libxml-rss-libxml-perl
          - libxml-rss-feed-perl
          - libxml-rss-per
          - libxml-sax-base-perl
          - libxml-sax-expat-incremental-perl
          - libxml-sax-perl
          - libxml-sax-machines-perl
          - libxml-sax-writer-perl
          - libxml-saxon-xslt2-perl
          - libxml-semanticdiff-perl
          - libxml-sax-expat-perl
          - libxml-simpleobject-enhanced-perl
          - libxml-simpleobject-libxml-perl/noble:0:53
          - libxml-simpleobject-perl
          - libxml-smart-perl
          - libxml-struct-perl
          - libxml-structured-perl
          - libxml-tidy-perl
          - libxml-tmx-perl
          - libxml-tokeparser-perl
          - libxml-treebuilder-perl
          - libxml-treepp-perl
          - libxml-twig-perl
          - libxml-um-perl
          - libxml-validate-perl
          - libxml-writer-perl
          - libxml-writer-simple-perl
          - libxml-writer-string-perl
          - libxml-xpath-perl
          - libxml-xpathengine-perl
          - libxml-xql-perl
          - libxml-xslt-perl
          - libxml-xupdate-libxml-perl
          - libxmlrpc-lite-perl
          - libxxx-perl
          - libyahc-perl
          - libyaml-appconfig-perl
          - libyaml-libyaml-perl/
          - libyaml-perl
          - libyaml-tiny-perl
          - libyaml-syck-perl
          - libyaml-pp-perl
          - libyaml-shell-perl
          - perl
          - perl-base
          - perlbrew
          - perltidier
          - perl-debug
          - perl-depends
          - perl-modules
          - perl-doc
          - perl-doc-html
          - gcc
          - g++
          - gcc-14
          - g++-14
          - cflow
          - cflow-l10n
          - cflow-doc
          - make
          - byacc
          - bison
          - flex
          - cmake
          - cmake-format
          - doxygen
          - shellcheck
          - adr-tools
          - pwgen
          - strace
          - gdb
          - valgrind
          - plantuml
    - name: Install NVM
      block:
        - name: Create the temporary file name for NVM
          ansible.builtin.tempfile:
          register: nvm_installer
        - name: Get NVM
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.2/install.sh
            dest: "{{ nvm_installer.path }}"
            mode: '700'
        - name: Run NVM installer
          ansible.builtin.command:
            cmd: "{{ nvm_installer.path }}"
          register: result
          changed_when: result.rc != 0
    - name: Install SDKMAN
      block:
        - name: Create the temporary file name for SDKMAN
          ansible.builtin.tempfile:
          register: sdkman_installer
        - name: Get SDKMAN
          ansible.builtin.get_url:
            url: https://get.sdkman.io
            dest: "{{ sdkman_installer.path }}"
            mode: '700'
        - name: Run SDKMAN installer
          ansible.builtin.command:
            cmd: "{{ sdkman_installer.path }}"
          register: result
          changed_when: result.rc != 0
    - name: Install Perlbrew
      block:
        - name: Create the temporary file name for Perlbrew
          ansible.builtin.tempfile:
          register: perlbrew_installer
        - name: Get Perlbrew
          ansible.builtin.get_url:
            url: https://install.perlbrew.pl
            dest: "{{ perlbrew_installer.path }}"
            mode: '700'
        - name: Run Perlbrew installer
          ansible.builtin.command:
            cmd: "{{ perlbrew_installer.path }}"
          register: result
          changed_when: result.rc != 0
        - name: Remove Perlbrew in ~/.bashrc
          ansible.builtin.lineinfile:
            path: ~/.bashrc
            search_string: '~/perl5/perlbrew/etc/bashrc'
            state: absent
        - name: Add Perlbrew to ~/.bashrc
          ansible.builtin.lineinfile:
            path: ~/.bashrc
            line: '[[ -r ~/perl5/perlbrew/etc/bashrc ]] && source ~/perl5/perlbrew/etc/bashrc'
    - name: Install Perl-5.42.2
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew switch perl-5.42.2 || perlbrew install --notest perl-5.42.2
          perlbrew switch perl-5.42.2
      register: result
      changed_when: result.rc != 0
    - name: Install cpanminus
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          source ~/perl5/perlbrew/etc/bashrc
          set -o pipefail
          echo 'y' | perlbrew install-cpanm
      register: result
      changed_when: result.rc != 0
    - name: Install Perl modules
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          source ~/perl5/perlbrew/etc/bashrc
          cpanm Modern::Perl Perl::Tidy Perl::Critic Data::Dumper\
            Try::Tiny Path::Tiny JSON::XS Perl::LanguageServer DBD::Pg
      register: result
      changed_when: result.rc != 0
...
